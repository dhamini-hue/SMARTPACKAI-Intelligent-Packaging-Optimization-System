version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: smartpack
      POSTGRES_PASSWORD: smartpassword
      POSTGRES_DB: smartpackdb
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://smartpack:smartpassword@db:5432/smartpackdb
    depends_on:
      - db
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
